<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链原型 A · 索引行 + 信号黄擦入</title>
<link rel="stylesheet" href="../src/main/resources/static/fonts/fonts.css">
<link rel="stylesheet" href="../src/main/resources/static/css/site.css">
<style>
/* ==========================================================================
   友链原型 A · 索引行
   不弄卡片，回到全站通用的「1px 细线行式」：整宽行 + 悬停信号黄从左侧擦满。
   首页文章索引、归档时间轴、标签页文章列表都是这套交互，所以这一版与全站最一致。
   ========================================================================== */

.fr-head { padding: 120px 0 56px; }
.fr-count { color: var(--ink-2); }

.fr-rows { border-top: 1px solid var(--line); }

/* 行：头像 / 正文 / 状态 / 时间。整行是一个 <a>，可点。 */
.fr-row {
  position: relative; isolation: isolate;
  display: grid; align-items: center;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: 20px; padding: 24px 20px 24px 8px;
  border-bottom: 1px solid var(--line);
}
/* 悬停填充层。z-index:-1 + isolation:isolate 让它垫在文字下面又不掉到页面背景后
   （与首页索引行同一套写法，规范 §6）。 */
.fr-row::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--signal-fill);
  clip-path: inset(0 100% 0 0);
  transition: clip-path .5s cubic-bezier(.16, 1, .3, 1);
}
.fr-row:hover::before { clip-path: inset(0 0 0 0); }
.fr-row:hover .fr-name,
.fr-row:hover .fr-desc,
.fr-row:hover .fr-meta,
.fr-row:hover .fr-net,
.fr-row:hover .fr-tick { color: var(--ink-on-signal); }
.fr-row:hover .fr-net::before { border-color: var(--ink-on-signal); }
.fr-row:hover .fr-tick { background: var(--ink-on-signal); }
.fr-row:hover .fr-ava { filter: none; }

/* 左上角的刻度：行被「定位」的标记 */
.fr-tick {
  position: absolute; top: 0; left: 0; width: 10px; height: 3px;
  background: var(--line-strong); transition: background .3s;
}

.fr-ava {
  width: 56px; height: 56px; object-fit: cover;
  background: var(--bg-sunken); border: 1px solid var(--line);
  color: transparent;
  filter: grayscale(1) contrast(.96) brightness(1.15); transition: filter .3s;
}
.fr-body { min-width: 0; }
.fr-name {
  display: block; font-family: var(--font-cjk); font-weight: 700;
  font-size: 20px; line-height: 1.35; color: var(--ink);
  transition: color .3s; overflow-wrap: break-word;
}
.fr-desc {
  display: block; margin-top: 4px; color: var(--ink-2); font-size: 17px;
  transition: color .3s;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 右列：状态 + 时间。窄屏收进正文下方 */
.fr-side {
  display: flex; align-items: center; gap: 22px;
  font-family: var(--font-mono); font-size: var(--fs-label);
  color: var(--ink-2); transition: color .3s;
}
.fr-net { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fr-net::before { content: ""; width: 8px; height: 8px; border: 1px solid var(--line-strong); }
.fr-net[data-net="0"]::before { background: #2f6b3a; border-color: #2f6b3a; }
.fr-net[data-net="1"]::before { background: var(--signal-edge); border-color: var(--signal-edge); }
.fr-net[data-net="2"]::before { background: #8a2b1f; border-color: #8a2b1f; }
.fr-net[data-net="3"]::before { background: #8a2b1f; border-color: var(--ink-on-signal); }
.fr-net[data-net="unknown"]::before { background: none; }
.fr-meta { white-space: nowrap; }

@media (max-width: 900px) {
  .fr-row { grid-template-columns: 44px minmax(0, 1fr); gap: 14px; }
  .fr-ava { width: 44px; height: 44px; }
  .fr-side { grid-column: 2; justify-content: flex-start; gap: 16px; }
  .fr-desc { white-space: normal; }
}

/* 入场：整行从左侧被「印」出来 —— 与全站 .wipe-in 同族 */
.fr-row { clip-path: inset(0 100% 0 0); animation: fr-print .8s cubic-bezier(.16, 1, .3, 1) forwards; }
@keyframes fr-print { to { clip-path: inset(0 0 0 0); } }

/* 原型之间的切换条 */
.proto-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; align-items: center; gap: 4px;
  height: 46px; padding: 0 20px;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em;
}
.proto-nav b { color: var(--signal-fill); margin-right: 14px; font-weight: 700; }
.proto-nav a { color: var(--bg); opacity: .55; padding: 4px 10px; transition: opacity .2s, background .2s; }
.proto-nav a:hover { opacity: 1; }
.proto-nav a.on { opacity: 1; background: var(--signal-fill); color: var(--ink-on-signal); }
</style>
</head>
<body>

<nav class="proto-nav">
  <b>友链版面原型</b>
  <a class="on" href="friends-a-rows.html">A 索引行</a>
  <a href="friends-b-network.html">B 据点星图</a>
  <a href="friends-c-carousel.html">C 3D 名片轮</a>
  <a href="friends-d-avatarwall.html">D 头像墙</a>
</nav>

<main>
  <header class="fr-head">
    <div class="wrap">
      <div class="eyebrow"><span class="bar"></span><span class="mono">Friends / 友人帐</span></div>
      <h1 class="page-title">友情链接</h1>
      <p class="page-lead">一张一张的名片摊在纸上。指针扫过哪一行，哪一行就亮起来。</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="fr-rows" id="rows"></div>
    </div>
  </section>
</main>

<script>
/* 假数据。状态分布照抄真实库：22 条里 11 条良好、11 条超时，
   外加两条 1/2 与一条坏值，把四值 + unknown 全摆出来看。 */
var FRIENDS = [
  ['chenzhen的博客',     '一个 Java 开发者的学习笔记与生活记录，慢写，认真改',        0, '2022-09-17'],
  ['coderZ编码世界',     '分享后端技术与踩坑记录的个人小站',                          3, '2022-10-12'],
  ['Echo\'s blog',      '前端 / 设计 / 随笔，偶尔写点读书笔记',                      0, '2022-12-11'],
  ['YuYang',            '在读学生的技术成长记录',                                    0, '2023-06-06'],
  ['Abin\'s blog',      '专注 Java 与分布式',                                        3, '2023-06-06'],
  ['豆豆 / Amos',       '生活、摄影与一点点代码',                                    3, '2023-06-06'],
  ['Ariasaki的小窝',    '随手记录，随便写写',                                        1, '2023-06-06'],
  ['小角落',            '一个安静的角落，放一些碎碎念',                              3, '2023-06-06'],
  ['八尺妖剑',          '游戏 / 动漫 / 技术，什么都写一点',                          3, '2023-06-06'],
  ['XXY的博客',         '后端工程师，关注云原生与可观测性',                          0, '2023-06-06'],
  ['赵赵卷',            '前端切图仔的日常',                                          0, '2023-06-06'],
  ['Queem',             '独立开发者，做小工具',                                      0, '2023-06-18'],
  ['知录',              '知识管理与笔记方法',                                        3, '2023-11-13'],
  ['Alx962的自留地',    '祝你餘生動聽呀～',                                          2, '2024-03-15'],
  ['JavaGPT',           '网站介绍',                                                  0, '2024-06-29'],
  ['ガヴのサイト',      '列车一定会到达下一站。那么舞台呢？我们呢？',                3, '2024-07-02'],
  ['东君博客',          '免费技术分享，Java 全栈',                                    0, '2024-08-11'],
  ['纤云弄巧',          '一个建立于 21 世纪，存活于互联网边缘的小站',                0, '2024-09-05'],
  ['沐雨橙风',          '一个专注技术分享的平台',                                    0, '2024-10-20'],
  ['拾壹博客',          '记录学习与生活',                                            3, '2025-01-08'],
  ['南山烟雨',          '珠江暮春，把盏经年谈笑间',                                  0, '2025-03-22'],
  ['旧时光',            '存一点旧东西',                                    'bad', '2025-05-30'],
];

var NET_TEXT = { '0': '良好', '1': '一般', '2': '异常', '3': '超时', 'unknown': '未知' };
/* 占位头像池：真实站点里每个友链是各自的头像，原型里用几张本地图轮着放，
   免得「同一个头像重复 11 次」把版面本身的问题误读成设计问题。 */
var PICS = ['hero-1.jpg', 'hero-2.jpg', 'hero-3.jpg', 'me.jpg', 'firstPicture.jpg']
    .map(function (n) { return '../src/main/resources/static/images/' + n; });

document.getElementById('rows').innerHTML = FRIENDS.map(function (f, i) {
    var name = f[0], desc = f[1], net = String(f[2]), joined = f[3];
    var known = net === '0' || net === '1' || net === '2' || net === '3';
    var key = known ? net : 'unknown';
    // 站点挂了的（超时/异常）头像也打不开 —— 用空档案格表示，与真实数据一致
    var alive = net === '0' || net === '1';
    var ava = alive
        ? '<img class="fr-ava" src="' + PICS[i % PICS.length] + '" alt="" width="56" height="56">'
        : '<img class="fr-ava" src="" alt="" width="56" height="56">';
    return '<a class="fr-row" href="#" style="animation-delay:' + (i * 26) + 'ms">'
        + '<span class="fr-tick"></span>'
        + ava
        + '<span class="fr-body">'
        +   '<span class="fr-name">' + name + '</span>'
        +   '<span class="fr-desc">' + desc + '</span>'
        + '</span>'
        + '<span class="fr-side">'
        +   '<span class="fr-net" data-net="' + key + '">' + NET_TEXT[key] + '</span>'
        +   '<span class="fr-meta">加入 ' + joined + ' · 巡检 10-01</span>'
        + '</span>'
        + '</a>';
}).join('');
</script>

</body>
</html>
