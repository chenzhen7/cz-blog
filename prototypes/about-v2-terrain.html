<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地形档案 · ChenZhen 的客栈</title>
  <link rel="stylesheet" href="../src/main/resources/static/fonts/fonts.css">
  <link rel="stylesheet" href="../src/main/resources/static/css/github-calendar.css">
  <link rel="stylesheet" href="about-v2.css">

  <script src="../src/main/resources/static/js/github-calendar.js" defer></script>
</head>
<body class="terrain">
  <header class="prototype-nav">
    <a class="wordmark" href="#about">ChenZhen 的客栈</a>
    <nav aria-label="切换设计原型">
      <a href="about-v2-terrain.html" aria-current="page">A 地形档案</a>
      <a href="about-v2-observatory.html">B 贡献观测站</a>
      <a href="about-v2-journal.html">C 个人杂志</a>
    </nav>
  </header>
  <main class="wrap" id="about">
    <section class="terrain-hero">
      <div class="terrain-copy enter">
        <p class="eyebrow">关于我 / About</p>
        <h1 aria-label="ChenZhen">Chen<span>Zhen</span></h1>
        <p class="intro">我是陈震。我在这里记录学到的技术，和解决问题的过程。</p>
        <a class="action primary" href="#github">查看 GitHub 贡献 <span aria-hidden="true">↓</span></a>
      </div>
      <div class="terrain-art enter">
        <img class="terrain-landscape" src="../src/main/resources/static/images/about.png" alt="远山、云层和层叠的蓝绿色水面" width="1920" height="1080">
        <span class="terrain-lines" aria-hidden="true"></span>
        <img class="terrain-avatar" src="../src/main/resources/static/images/me.jpg" alt="ChenZhen 的博客头像" width="750" height="750">
      </div>
    </section>

    <section class="section terrain-activity" id="github" aria-labelledby="activity-title">
      <div class="section-head">
        <h2 id="activity-title">GitHub 贡献</h2>
        <a class="text-link" href="https://github.com/chenzhen7">@chenzhen7 <span aria-hidden="true">↗</span></a>
      </div>
      <div data-calendar></div>
      <noscript><p>在 GitHub 个人资料页查看贡献日历。</p></noscript>
    </section>

    <section class="section terrain-notes" aria-labelledby="notes-title">
      <h2 id="notes-title">把博客当作<br>学习笔记</h2>
      <div>
        <p>这间客栈起初是一个练手的 Spring Boot 项目。后来，每次把一个问题和解法写清楚，博客就多留下一页可回头查阅的笔记。</p>
        <p>平时关注 Java、Web 框架、微服务、数据库、缓存和消息队列，也会折腾前端、Docker 和 Linux。</p>
        <a class="text-link" href="https://github.com/chenzhen7/cz-blog">客栈的源代码 <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>
  <footer class="page-end wrap">ChenZhen 的客栈</footer>
