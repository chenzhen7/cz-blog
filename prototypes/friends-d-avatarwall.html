<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链原型 D · 无框头像墙</title>
<link rel="stylesheet" href="../src/main/resources/static/fonts/fonts.css">
<link rel="stylesheet" href="../src/main/resources/static/css/site.css">
<style>
/* ==========================================================================
   友链原型 D · 无框头像墙
   去掉所有卡片与边框：头像放大密排成一面「人脸墙」，站点名只在指针停上去时浮出。
   图像主导、极简。整面墙随指针轻微倾斜（首页图像场那套的放大版）。
   注意：这一页有一半友链已挂，空槽会很多——空槽用首字占位块表示，读作「缺一张照片」。
   ========================================================================== */

.fr-head { padding: 120px 0 44px; }

.wall-stage { perspective: 1600px; }
.wall {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: 10px;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.16, 1, .3, 1);
}

.tile {
  position: relative; aspect-ratio: 1 / 1;
  transform-style: preserve-3d;
  transition: transform .35s cubic-bezier(.16, 1, .3, 1);
}
.tile .face {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover;
  background: var(--bg-sunken);
  filter: grayscale(1) contrast(.96) brightness(1.12);
  transition: filter .3s;
}
/* 空槽（站点已挂）：首字占位块。斜切一角，读作「缺一张照片」而不是渲染坏了 */
.tile .void {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-sunken); border: 1px dashed var(--line-strong);
  font-family: var(--font-disp); font-weight: 800; font-size: 26px;
  color: var(--line-strong);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
}
.tile:hover { transform: translateZ(48px); z-index: 5; }
.tile:hover .face { filter: none; }

/* 悬停时浮出的名牌。绝对定位在头像下方，不占版面高度 */
.tile .plate {
  position: absolute; left: 50%; bottom: -6px; transform: translate(-50%, 8px);
  z-index: 6; pointer-events: none;
  padding: 5px 10px; white-space: nowrap;
  background: var(--ink); color: var(--bg);
  font-size: var(--fs-label); line-height: 1.2;
  opacity: 0; transition: opacity .25s, transform .25s;
}
.tile:hover .plate { opacity: 1; transform: translate(-50%, 0); }
.tile .plate .pn { color: var(--signal-fill); margin-right: 8px; font-family: var(--font-mono); }

/* 角落状态点。小的填充方块，四值配色与全站一致 */
.tile .dot {
  position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
  border: 1px solid var(--line-strong);
}
.tile .dot[data-net="0"] { background: #2f6b3a; border-color: #2f6b3a; }
.tile .dot[data-net="1"] { background: var(--signal-edge); border-color: var(--signal-edge); }
.tile .dot[data-net="2"] { background: #8a2b1f; border-color: #8a2b1f; }
.tile .dot[data-net="3"] { background: #8a2b1f; border-color: var(--ink-on-signal); }
.tile .dot[data-net="unknown"] { background: none; }

/* 图例：说明空槽与状态点，否则读者不知道那些空格是什么 */
.legend {
  display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 34px;
  padding-top: 18px; border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: var(--fs-label); color: var(--ink-2);
}
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 9px; height: 9px; border: 1px solid var(--line-strong); font-style: normal; }
.legend i.g { background: #2f6b3a; border-color: #2f6b3a; }
.legend i.y { background: var(--signal-edge); border-color: var(--signal-edge); }
.legend i.r { background: #8a2b1f; border-color: #8a2b1f; }
.legend i.v { background: var(--bg-sunken); border-style: dashed; }

@media (max-width: 900px) {
  .wall { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
}

.proto-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; align-items: center; gap: 4px;
  height: 46px; padding: 0 20px;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em;
}
.proto-nav b { color: var(--signal-fill); margin-right: 14px; font-weight: 700; }
.proto-nav a { color: var(--bg); opacity: .55; padding: 4px 10px; transition: opacity .2s, background .2s; }
.proto-nav a:hover { opacity: 1; }
.proto-nav a.on { opacity: 1; background: var(--signal-fill); color: var(--ink-on-signal); }
</style>
</head>
<body>

<nav class="proto-nav">
  <b>友链版面原型</b>
  <a href="friends-b-network.html">B 据点星图</a>
  <a href="friends-b2-scale.html">B2 规模压测</a>
  <a class="on" href="friends-d-avatarwall.html">D 头像墙</a>
</nav>

<main>
  <header class="fr-head">
    <div class="wrap">
      <div class="eyebrow"><span class="bar"></span><span class="mono">Friends / 友人帐</span></div>
      <h1 class="page-title">友情链接</h1>
      <p class="page-lead">一面人脸墙。指针停上去，头像恢复彩色、名字浮出来。</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="wall-stage" id="stage">
        <div class="wall" id="wall"></div>
      </div>
      <div class="legend">
        <span><i class="g"></i>良好</span>
        <span><i class="y"></i>一般</span>
        <span><i class="r"></i>异常 / 超时</span>
        <span><i class="v"></i>站点已挂（图也打不开）</span>
      </div>
    </div>
  </section>
</main>

<script>
var FRIENDS = [
  ['chenzhen的博客', 0], ['coderZ编码世界', 3], ['Echo\'s blog', 0], ['YuYang', 0],
  ['Abin\'s blog', 3],   ['豆豆 / Amos', 3],    ['Ariasaki的小窝', 1], ['小角落', 3],
  ['八尺妖剑', 3],       ['XXY的博客', 0],      ['赵赵卷', 0],        ['Queem', 0],
  ['知录', 3],           ['Alx962的自留地', 2], ['JavaGPT', 0],       ['ガヴのサイト', 3],
  ['东君博客', 0],       ['纤云弄巧', 0],       ['沐雨橙风', 0],      ['拾壹博客', 3],
  ['南山烟雨', 0],       ['旧时光', 'bad'],
];

var NET_TEXT = { '0': '良好', '1': '一般', '2': '异常', '3': '超时', 'unknown': '未知' };
/* 占位头像池：真实站点里每个友链是各自的头像，原型里用几张本地图轮着放，
   免得「同一个头像重复 11 次」把版面本身的问题误读成设计问题。 */
var PICS = ['hero-1.jpg', 'hero-2.jpg', 'hero-3.jpg', 'me.jpg', 'firstPicture.jpg']
    .map(function (n) { return '../src/main/resources/static/images/' + n; });
var wall = document.getElementById('wall');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

wall.innerHTML = FRIENDS.map(function (f, i) {
    var name = f[0], net = String(f[1]);
    var known = net === '0' || net === '1' || net === '2' || net === '3';
    var key = known ? net : 'unknown';
    var alive = net === '0' || net === '1';
    var face = alive
        ? '<img class="face" src="' + PICS[i % PICS.length] + '" alt="" width="112" height="112">'
        : '<span class="void">' + name.charAt(0) + '</span>';
    return '<a class="tile" href="#" style="animation-delay:' + (i * 18) + 'ms">'
        + face
        + '<span class="dot" data-net="' + key + '"></span>'
        + '<span class="plate"><span class="pn">' + NET_TEXT[key] + '</span>' + name + '</span>'
        + '</a>';
}).join('');

/* 入场：一格一格亮起来（纯 CSS keyframes，新节点自动重播那套的同源写法） */
if (!reduce) {
    var st = document.createElement('style');
    st.textContent = '@keyframes tileIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}'
        + '.tile{animation:tileIn .5s cubic-bezier(.16,1,.3,1) backwards}';
    document.head.appendChild(st);
}

/* 整面墙随指针轻微倾斜：与首页图像场同族，父级 perspective + 容器 rotateX/rotateY。
   插值在唯一一个 rAF 循环里；指针停住即收敛，循环随之自停（规范 §5.2）。 */
var fine = window.matchMedia('(pointer: fine)').matches;
if (fine && !reduce) {
    var stage = document.getElementById('stage');
    var tx = 0, ty = 0, cx = 0, cy = 0, rafId = null;
    stage.addEventListener('pointermove', function (e) {
        var r = stage.getBoundingClientRect();
        tx = ((e.clientX - r.left) / r.width - .5) * 2;
        ty = ((e.clientY - r.top) / r.height - .5) * 2;
        if (rafId === null) rafId = requestAnimationFrame(tick);
    });
    stage.addEventListener('pointerleave', function () {
        tx = ty = 0;
        if (rafId === null) rafId = requestAnimationFrame(tick);
    });
    function tick() {
        rafId = null;
        cx += (tx - cx) * 0.07;
        cy += (ty - cy) * 0.07;
        wall.style.transform = 'rotateX(' + (-cy * 4).toFixed(2) + 'deg) rotateY(' + (cx * 5).toFixed(2) + 'deg)';
        if (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) rafId = requestAnimationFrame(tick);
    }
}
</script>

</body>
</html>
