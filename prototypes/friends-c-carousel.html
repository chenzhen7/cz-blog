<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链原型 C · 3D 环形名片轮</title>
<link rel="stylesheet" href="../src/main/resources/static/fonts/fonts.css">
<link rel="stylesheet" href="../src/main/resources/static/css/site.css">
<style>
/* ==========================================================================
   友链原型 C · 3D 环形名片轮
   卡片站在一个 3D 圆柱面上绕中轴排布，绕中轴旋转：转到正面的又大又清楚，
   两侧的斜着退后，背面被 backface-visibility 挡掉。
   指针左右移动带动整圈旋转；不碰它的时候自己慢慢转。
   ========================================================================== */

.fr-head { padding: 120px 0 40px; }

.ring-stage {
  position: relative; height: clamp(420px, 52vh, 620px);
  perspective: 2600px; perspective-origin: 50% 45%;
}
.ring {
  position: absolute; left: 50%; top: 45%;
  transform-style: preserve-3d;
  will-change: transform;
}
/* 每张卡：绕中轴 rotateY 到自己的角度，再沿半径推出去。
   圆环半径由脚本按卡片宽度算（要够大，否则相邻卡会互相穿插）。 */
.ring .cd {
  position: absolute; left: 0; top: 0;
  width: 168px; height: 196px; margin: -98px 0 0 -84px;
  background: var(--bg); border: 1px solid var(--line);
  padding: 16px 16px 12px;
  display: flex; flex-direction: column;
  backface-visibility: hidden;
  transform-style: preserve-3d;
  transition: border-color .3s;
}
.ring .cd:hover { border-color: var(--signal-edge); }
.ring .cd::before {
  content: ""; position: absolute; top: 0; left: 0; width: 18px; height: 3px;
  background: var(--line-strong); transition: background .3s;
}
.ring .cd:hover::before { background: var(--signal-edge); }

.ring .ava {
  width: 46px; height: 46px; object-fit: cover;
  background: var(--bg-sunken); border: 1px solid var(--line);
  color: transparent;
  filter: grayscale(1) contrast(.96) brightness(1.15); transition: filter .3s;
}
.ring .cd:hover .ava { filter: none; }
.ring .nm {
  display: block; margin-top: 12px;
  font-family: var(--font-cjk); font-weight: 700; font-size: 17px; line-height: 1.3;
  color: var(--ink); overflow-wrap: break-word;
}
.ring .ds {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; margin-top: 6px; font-size: 15px; color: var(--ink-2);
}
.ring .st {
  margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 13px; color: var(--ink-2);
}
.ring .st::before { content: ""; width: 7px; height: 7px; border: 1px solid var(--line-strong); }
.ring .st[data-net="0"]::before { background: #2f6b3a; border-color: #2f6b3a; }
.ring .st[data-net="1"]::before { background: var(--signal-edge); border-color: var(--signal-edge); }
.ring .st[data-net="2"]::before { background: #8a2b1f; border-color: #8a2b1f; }
.ring .st[data-net="3"]::before { background: #8a2b1f; border-color: var(--ink-on-signal); }
.ring .st[data-net="unknown"]::before { background: none; }

/* 中轴：一条信号黄竖线，说明这些卡是绕它转的（全图唯一的实心黄） */
.axis {
  position: absolute; left: 50%; top: 12%; bottom: 12%; width: 1px;
  background: var(--signal-edge); transform: translateX(-.5px);
}
.axis::before, .axis::after {
  content: ""; position: absolute; left: -3px; width: 7px; height: 7px;
  background: var(--signal-fill); border: 1px solid var(--signal-edge);
}
.axis::before { top: -3px; } .axis::after { bottom: -3px; }

.hint {
  text-align: center; font-family: var(--font-mono); font-size: var(--fs-label);
  letter-spacing: .1em; color: var(--ink-2); margin-top: 8px;
}

@media (max-width: 900px) {
  .ring-stage { height: 380px; perspective: 1800px; }
  .ring .cd { width: 132px; height: 170px; margin: -85px 0 0 -66px; padding: 12px; }
  .ring .nm { font-size: 15px; } .ring .ds { display: none; }
}

.proto-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  display: flex; align-items: center; gap: 4px;
  height: 46px; padding: 0 20px;
  background: var(--ink); color: var(--bg);
  font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em;
}
.proto-nav b { color: var(--signal-fill); margin-right: 14px; font-weight: 700; }
.proto-nav a { color: var(--bg); opacity: .55; padding: 4px 10px; transition: opacity .2s, background .2s; }
.proto-nav a:hover { opacity: 1; }
.proto-nav a.on { opacity: 1; background: var(--signal-fill); color: var(--ink-on-signal); }
</style>
</head>
<body>

<nav class="proto-nav">
  <b>友链版面原型</b>
  <a href="friends-a-rows.html">A 索引行</a>
  <a href="friends-b-network.html">B 据点星图</a>
  <a class="on" href="friends-c-carousel.html">C 3D 名片轮</a>
  <a href="friends-d-avatarwall.html">D 头像墙</a>
</nav>

<main>
  <header class="fr-head">
    <div class="wrap">
      <div class="eyebrow"><span class="bar"></span><span class="mono">Friends / 友人帐</span></div>
      <h1 class="page-title">友情链接</h1>
      <p class="page-lead">名片绕着一根中轴排成一圈。左右移动指针，整圈跟着转。</p>
    </div>
  </header>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="ring-stage" id="stage">
        <div class="axis"></div>
        <div class="ring" id="ring"></div>
      </div>
      <p class="hint">← 指针左右移动 → 转动整圈 ／ 靠前的卡片可直接点击</p>
    </div>
  </section>
</main>

<script>
var FRIENDS = [
  ['chenzhen的博客',  '一个 Java 开发者的学习笔记', 0],
  ['coderZ编码世界',  '分享后端技术与踩坑记录',     3],
  ['Echo\'s blog',   '前端 / 设计 / 随笔',          0],
  ['YuYang',         '在读学生的技术成长记录',      0],
  ['Abin\'s blog',   '专注 Java 与分布式',          3],
  ['豆豆 / Amos',    '生活、摄影与一点点代码',      3],
  ['Ariasaki的小窝', '随手记录，随便写写',          1],
  ['小角落',         '一个安静的角落',              3],
  ['八尺妖剑',       '游戏 / 动漫 / 技术',          3],
  ['XXY的博客',      '关注云原生与可观测性',        0],
  ['赵赵卷',         '前端切图仔的日常',            0],
  ['Queem',          '独立开发者，做小工具',        0],
  ['知录',           '知识管理与笔记方法',          3],
  ['Alx962的自留地', '祝你餘生動聽呀～',            2],
  ['JavaGPT',        '网站介绍',                    0],
  ['ガヴのサイト',   '列车一定会到达下一站',        3],
  ['东君博客',       '免费技术分享，Java 全栈',      0],
  ['纤云弄巧',       '存活于互联网边缘的小站',      0],
  ['沐雨橙风',       '专注技术分享的平台',          0],
  ['拾壹博客',       '记录学习与生活',              3],
  ['南山烟雨',       '把盏经年谈笑间',              0],
  ['旧时光',         '存一点旧东西',              'bad'],
];

var NET_TEXT = { '0': '良好', '1': '一般', '2': '异常', '3': '超时', 'unknown': '未知' };
/* 占位头像池：真实站点里每个友链是各自的头像，原型里用几张本地图轮着放，
   免得「同一个头像重复 11 次」把版面本身的问题误读成设计问题。 */
var PICS = ['hero-1.jpg', 'hero-2.jpg', 'hero-3.jpg', 'me.jpg', 'firstPicture.jpg']
    .map(function (n) { return '../src/main/resources/static/images/' + n; });
var ring = document.getElementById('ring');
var stage = document.getElementById('stage');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var N = FRIENDS.length;
var STEP = 360 / N;          // 每张卡占的角度
var cards = [];

FRIENDS.forEach(function (f, i) {
    var name = f[0], desc = f[1], net = String(f[2]);
    var known = net === '0' || net === '1' || net === '2' || net === '3';
    var key = known ? net : 'unknown';
    var alive = net === '0' || net === '1';
    var el = document.createElement('a');
    el.className = 'cd';
    el.href = '#';
    // 半径由脚本统一设置（见下），这里先只放角度
    el.style.transform = 'rotateY(' + (i * STEP) + 'deg) translateZ(var(--r))';
    el.innerHTML =
        '<img class="ava" src="' + (alive ? PICS[i % PICS.length] : '') + '" alt="" width="46" height="46">' +
        '<span class="nm">' + name + '</span>' +
        '<span class="ds">' + desc + '</span>' +
        '<span class="st" data-net="' + key + '">' + NET_TEXT[key] + '</span>';
    ring.appendChild(el);
    cards.push(el);
});

/* 半径要够大，否则 22 张卡在圆环上会互相穿插：
   相邻卡间距 = 2πR/N，至少要放下卡宽（168）再留一点缝 → R > N*168/(2π)*1.12 */
function layout() {
    var w = window.innerWidth;
    var cardW = w <= 900 ? 132 : 168;
    var R = Math.round(N * cardW / (2 * Math.PI) * 1.16);
    ring.style.setProperty('--r', R + 'px');
    // transform 里用了 var(--r)，改完要重新触发一次解析：直接重写一遍
    cards.forEach(function (el, i) {
        el.style.transform = 'rotateY(' + (i * STEP) + 'deg) translateZ(' + R + 'px)';
    });
    ring.dataset.r = R;
}
layout();
window.addEventListener('resize', layout);

/* 旋转：指针左右位置映射到整圈角度；指针不在舞台上时自动慢转。
   插值在唯一一个 rAF 循环里做（规范 §5.2：不用 state 追踪连续值）。 */
var target = 0, cur = 0, autoSpin = !reduce, rafId = null, dragging = false;

function kick() { if (rafId === null) rafId = requestAnimationFrame(tick); }

function tick() {
    rafId = null;
    if (autoSpin) target += 0.06;                 // 没人碰的时候自己慢慢转
    cur += (target - cur) * 0.08;
    if (Math.abs(target - cur) < 0.01) cur = target;
    ring.style.transform = 'rotateY(' + (-cur).toFixed(2) + 'deg)';

    // 正面最清楚、越往两侧越淡。角度差用余弦算，写 opacity 是另一个属性，不冲突
    cards.forEach(function (el, i) {
        var a = ((i * STEP + cur) % 360 + 360) % 360;   // 0 = 正对观者
        var facing = a > 180 ? 360 - a : a;             // 折到 0..180
        var k = Math.max(0, Math.cos(facing * Math.PI / 180));
        el.style.opacity = (0.25 + 0.75 * k * k).toFixed(3);
    });

    if (autoSpin || Math.abs(target - cur) > 0.01) kick();
}

stage.addEventListener('pointermove', function (e) {
    if (dragging) return;
    autoSpin = false;
    var r = stage.getBoundingClientRect();
    var t = (e.clientX - r.left) / r.width;          // 0..1
    target = t * 360 * 2;                            // 扫过整宽 = 两圈，手感够快
    kick();
});
stage.addEventListener('pointerleave', function () { if (!dragging) autoSpin = !reduce; kick(); });
// 拖拽也支持（触屏 / 按住拖）
var dragX = 0, dragCur = 0;
stage.addEventListener('pointerdown', function (e) {
    dragging = true; dragX = e.clientX; dragCur = cur; autoSpin = false;
    stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    target = dragCur - (e.clientX - dragX) * 0.5;
    kick();
});
stage.addEventListener('pointerup', function () { dragging = false; autoSpin = !reduce; kick(); });

kick();
</script>

</body>
</html>
