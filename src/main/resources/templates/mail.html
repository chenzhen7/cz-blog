<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="referrer" content="no-referrer"/>
    <meta charset="UTF-8">
    <title>评论回复通知</title>
</head>
<!--/* 评论回复通知邮件（信笺式）。

     邮件 HTML 的三条硬约束，这份模板的写法全部由它们决定：
     一、样式必须全部内联。Gmail / QQ 邮箱会剥掉 <style> 与 <link>。
     二、布局必须 table。flex / grid 在 Outlook（Word 渲染引擎）里直接塌。
     三、不用外部图片。多数客户端默认拦截，原模板的有道云 logo 与二维码必裂，
        品牌行改成纯 HTML 的信号黄小方块 + 站名。

     信号黄按规范 §2.2 拆档：实心块 #ffe600 必带 #edc800 描边（否则白底上边界隐形），
     要读的文字（链接）用深金 #6b5d00。全直角，与全站一致。 */-->
<body style="margin:0; padding:0; background:#f7f8fa;">
<div style="background:#f7f8fa; padding:28px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

    <!-- 品牌行：信号黄小方块 + 站名，右侧栏目标签 -->
    <tr><td style="padding:0 4px 14px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
            <td align="left">
                <span style="display:inline-block; width:10px; height:10px; background:#ffe600; border:1px solid #edc800; vertical-align:middle;"></span>
                <span style="font-size:15px; font-weight:bold; color:#111111; vertical-align:middle; margin-left:8px;">ChenZhen的客栈</span>
            </td>
            <td align="right" style="font-size:12px; letter-spacing:2px; color:#4a4a4a;">MESSAGE / 评论回复</td>
        </tr></table>
    </td></tr>

    <!-- 封缄线 -->
    <tr><td style="height:4px; background:#ffe600; border-bottom:1px solid #edc800; font-size:0; line-height:0;">&nbsp;</td></tr>

    <!-- 信纸 -->
    <tr><td style="background:#ffffff; border:1px solid #e8e8e8; border-top:0; padding:34px 38px;">

        <p style="margin:0 0 16px; font-size:20px; line-height:1.6; color:#111111; font-weight:bold;"
           th:text="'亲爱的：'+${name}">亲爱的：XXX</p>
        <p style="margin:0 0 24px; font-size:15px; line-height:1.9; color:#4a4a4a;"
           th:text="${theme}">你在XXX的评论有了新的回复！</p>

        <!-- 原评论可能被删（comment 为空），整块不出现 -->
        <div th:if="${comment!=null}">
            <p style="margin:0 0 8px; font-size:13px; letter-spacing:2px; color:#6b5d00;">您的评论</p>
            <div style="border-left:3px solid #edc800; background:#fafaf9; padding:12px 16px; margin:0 0 24px; font-size:14px; line-height:1.8; color:#333333;"
                 th:text="${comment}">评论内容巴拉巴拉</div>
        </div>

        <p style="margin:0 0 8px; font-size:13px; letter-spacing:2px; color:#6b5d00;"
           th:text="${respondent}+' 给您的回复'">XXX 给您的回复</p>
        <div style="border-left:3px solid #edc800; background:#fafaf9; padding:12px 16px; margin:0 0 28px; font-size:14px; line-height:1.8; color:#333333;"
             th:text="${reply}">回复内容巴拉巴拉</div>

        <a th:href="'https://www.chenzhen.space'+${address}"
           style="display:inline-block; background:#ffe600; border:1px solid #edc800; color:#111111; font-size:15px; font-weight:bold; letter-spacing:2px; text-decoration:none; padding:12px 26px;">查看原网站评论</a>
        <p style="margin:14px 0 0; font-size:13px; line-height:1.8; color:#999999;">按钮点不动？复制链接到浏览器打开：<a th:href="'https://www.chenzhen.space'+${address}"
           style="color:#6b5d00; text-decoration:none; word-break:break-all;"
           th:text="'https://www.chenzhen.space'+${address}">https://www.chenzhen.space</a></p>

        <p style="margin:32px 0 0; font-size:14px; line-height:1.9; color:#111111;">此致<br><strong>陈震（chenzhen）</strong></p>

    </td></tr>

    <!-- 页脚 -->
    <tr><td style="padding:18px 0 0; text-align:center; font-size:12px; line-height:1.8; color:#999999;">此为系统邮件，请勿回复 · ChenZhen的客栈</td></tr>

</table>
</td></tr></table>
</div>
</body>
</html>
