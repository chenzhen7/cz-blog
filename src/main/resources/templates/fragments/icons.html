<!--
  Bootstrap Icons 的 <symbol> sprite。

  为什么需要它：admin 的 12 个模板里有 110 处
      <svg class="bi pe-none me-2" width="16" height="16"><use xlink:href="#home"></use></svg>
  但项目里从来没有定义过任何 <symbol>，所以这些图标一直渲染成空白。

  只用到了 6 个图标，就从 Bootstrap Icons 1.11.3 取了这 6 个（MIT 许可）：
      home(house) / people-circle / table / speedometer2 / grid / bootstrap

  <use xlink:href="#id"> 是文档内引用，所以 sprite 必须内联在页面里，
  不能放外部文件。各 admin 页面在 <body> 开头引入一次即可：

      <th:block th:replace="~{fragments/icons :: sprite}"/>

  注意调用方的 <svg> 没有 viewBox，靠 <symbol> 自带的 viewBox 完成缩放。
-->
