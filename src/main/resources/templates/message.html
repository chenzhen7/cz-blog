<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="referrer" content="no-referrer"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板-ChenZhen的客栈-CZ的java学习日记</title>
    <meta name="description" content="ChenZhen的个人博客，留言板页面，博客留言信息显示">
    <meta name="keywords" content="ChenZhen,博客,留言板,留言">
    <link href="../static/images/favicon.ico" th:href="@{/images/favicon.ico}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/tide-lines.js}"></script>
    <link rel="alternate" type="application/rss+xml" title="ChenZhen的客栈" th:href="@{/rss}">

    <!--/* 动效初始态的门控。必须留在 <head> 里，不能挪到 </body> 前 —— 理由见片段内注释。 */-->
    <th:block th:replace="~{fragments/chrome :: animGate}"/>
</head>
<body>

<th:block th:replace="~{fragments/chrome :: grain}"/>
<th:block th:replace="~{fragments/chrome :: pageWipe('Message / 留言板')}"/>
<th:block th:replace="~{fragments/chrome :: topbar('message')}"/>

<main>

    <!--/* model 来自 MessageController.message()：page（PageInfo<MessageVO>）、author。
           改版前那条 45vh 的背景图带去掉，改用全站统一的 .page-head。 */-->
    <header class="page-head has-tide-lines">
        <div th:replace="~{fragments/chrome :: tideArt(@{/images/depth-lines.svg}, 'depth')}"></div>
        <div class="wrap">
            <div class="tide-copy">
                <div class="tide-copy-line">
                    <div class="eyebrow wipe-in">
                        <span class="bar"></span>
                        <span class="mono">Message / 留言板</span>
                    </div>
                </div>
                <div class="tide-copy-line">
                    <h1 class="page-title wipe-in">留言板</h1>
                </div>
                <div class="tide-copy-line">
                    <p class="page-lead rise">有什么对我想说的话，来吧！</p>
                </div>
            </div>
        </div>
    </header>

    <section class="section">
        <div class="wrap">

            <!--/* 发帖区。「续写对话」式：表单套用留言项 .cm 的骨架，写的时候看到的就是
                   发出去的样子。它在 #message-container 之外 —— 发送成功后那个容器会被
                   AJAX 整块替换，表单放进去会一起被冲掉。
                   这里不是 <form>：提交走下面的 fetch，与改版前一致（原来是 $.ajax 的 .load()）。
                   所有 name 都是后端 Message 实体的绑定契约，一个字不能改：
                   parentMessageId / rootMessageId / avatar / email / nickname / address / content。
                   三个 hidden 由脚本维护：avatar 由邮箱推出来，另两个由「回复」按钮填。 */-->
            <div class="cm cm-compose rise" id="message-form">
                <div class="cm-avatar">
                    <img id="avatar" th:src="@{/images/me.jpg}" alt="头像预览" width="48" height="48">
                </div>
                <div class="cm-body">
                    <input type="hidden" name="parentMessageId">
                    <input type="hidden" name="rootMessageId">
                    <input type="hidden" name="avatar" value="/images/me.jpg">

                    <div class="cm-head">
                        <input name="nickname" type="text" class="cc-input cc-name" placeholder="昵称"
                               th:value="${session.user != null ? session.user.nickname : ''}">
                        <span class="cm-badge cc-badge">你</span>
                        <input id="emailInput" name="email" type="email" class="cc-input cc-mail" placeholder="邮箱"
                               th:value="${session.user != null ? session.user.email : ''}">
                        <input name="address" type="text" class="cc-input cc-site" placeholder="站点（选填）">
                    </div>

                    <textarea id="message-content" name="content" class="cc-text" rows="3"
                              placeholder="注意文明发言哦~"></textarea>

                    <th:block th:replace="~{fragments/chrome :: emojiBar}"/>

                    <div class="cm-foot">
                        <button id="emojiToggle" type="button" class="cc-tool"
                                aria-expanded="false" aria-controls="emojiBar">😀 表情</button>
                        <span class="cc-hint mono-sm">邮箱只用来取头像，不会公开</span>
                        <button id="messagepost-btn" type="button" class="btn-primary magnet cut-br cc-send">发送</button>
                    </div>
                </div>
            </div>

            <!--/* 留言列表。
                   这个 div 同时是 Thymeleaf 片段 messageList：
                   MessageController.messageComment() 返回 "message :: messageList"，
                   单独渲染它并返回纯片段 HTML，页面脚本收到后替换整个容器。
                   所以 #message-container 这个 id 与 messageList 这个片段名都不能改 ——
                   它们是 Controller 直接返回视图名依赖的契约。 */-->
            <div class="cm-list" id="message-container" th:fragment="messageList">
                <div class="cm" th:each="message : ${page.list}">
                    <div class="cm-avatar">
                        <img th:src="@{${message.avatar}}" alt="" width="48" height="48" loading="lazy" decoding="async">
                        <a class="link-mask" th:if="${message.address != null}"
                           target="_blank" rel="noopener" th:href="@{${message.address}}"
                           th:title="${message.nickname} + ' 的站点'">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
                                <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
                            </svg>
                            <span class="visually-hidden">访问站点</span>
                        </a>
                    </div>
                    <div class="cm-body">
                        <div class="cm-head">
                            <span class="cm-name" th:text="${message.nickname}">ChenZhen</span>
                            <span class="cm-badge" th:if="${message.adminMessage}">站主</span>
                        </div>
                        <div class="cm-text" th:text="${message.content}">快来说点什么吧</div>
                        <div class="cm-foot">
                            <span th:text="${#temporals.format(message.createTime)}">2023-12-15 23:46</span>
                            <!--/* data-* 三个值是「回复」要用的：parent 是直接上级，root 是整条线程的顶。
                                   原来靠 jQuery 的 $(obj).data('rootmessageid') 读，
                                   现在用 dataset 读，属性名不变。 */-->
                            <a data-reply
                               th:data-parentmessageid="${message.id}"
                               th:data-messagenickname="${message.nickname}"
                               th:data-rootmessageid="${message.id}">回复</a>
                            <a th:if="${session.user}"
                               th:href="@{/message/delete/{id}(id=${message.id},pageNum=${page.pageNum})}"
                               onclick="return confirm('确定要删除该评论吗？三思啊! 删了可就没了！')">删除</a>
                        </div>

                        <div class="cm-replies" th:if="${#arrays.length(message.messageReplyList)} > 0">
                            <div class="cm" th:each="reply : ${message.messageReplyList}">
                                <div class="cm-avatar">
                                    <img th:src="@{${reply.avatar}}" alt="" width="48" height="48" loading="lazy" decoding="async">
                                    <a class="link-mask" th:if="${reply.address != null}"
                                       target="_blank" rel="noopener" th:href="@{${reply.address}}"
                                       th:title="${reply.nickname} + ' 的站点'">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                                            <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
                                            <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
                                        </svg>
                                        <span class="visually-hidden">访问站点</span>
                                    </a>
                                </div>
                                <div class="cm-body">
                                    <div class="cm-head">
                                        <span class="cm-name" th:text="${reply.nickname}">ChenZhen</span>
                                        <span class="cm-badge" th:if="${reply.adminMessage}">站主</span>
                                        <!--/* 只在「回复的不是根留言」时才 @ 人：直接回复楼主的消息里 @ 楼主是废话 */-->
                                        <span class="cm-at" th:if="${reply.parentMessageId != reply.rootMessageId}"
                                              th:text="'@' + ${reply.parentNickname}">@小白</span>
                                    </div>
                                    <div class="cm-text" th:text="${reply.content}">快来说点什么吧</div>
                                    <div class="cm-foot">
                                        <span th:text="${#temporals.format(reply.createTime)}">2023-12-15 23:46</span>
                                        <a data-reply
                                           th:data-parentmessageid="${reply.id}"
                                           th:data-messagenickname="${reply.nickname}"
                                           th:data-rootmessageid="${message.id}">回复</a>
                                        <a th:if="${session.user}"
                                           th:href="@{/message/delete/{id}(id=${reply.id},pageNum=${page.pageNum})}"
                                           onclick="return confirm('确定要删除该评论吗？三思啊! 删了可就没了！')">删除</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="cm-empty" th:if="${#lists.isEmpty(page.list)}">还没有留言，来说第一句吧。</p>
            </div>

            <nav class="pager" th:if="${page.pages > 1}" aria-label="分页">
                <a th:classappend="${page.hasPreviousPage} ? '' : 'is-off'"
                   th:href="@{/message(pageNum=${page.prePage})}">上一页</a>
                <a th:each="num : ${page.navigatepageNums}" th:href="@{/message(pageNum=${num})}"
                   th:text="${num}" th:attr="aria-current=${page.pageNum == num} ? 'page' : null">1</a>
                <a th:classappend="${page.hasNextPage} ? '' : 'is-off'"
                   th:href="@{/message(pageNum=${page.nextPage})}">下一页</a>
            </nav>

        </div>
    </section>

</main>

<th:block th:replace="~{fragments/chrome :: footer}"/>

<th:block th:replace="~{fragments/chrome :: searchDialog}"/>
<th:block th:replace="~{fragments/chrome :: scripts}"/>
<th:block th:replace="~{fragments/chrome :: motion}"/>

<!--/* 页面自己的脚本。
     全部改成事件委托，不再绑在具体元素上 —— 这是必须的：发送完留言会整个替换
     #message-container，里面所有节点都是新的，绑在旧节点上的监听会一起消失。
     委托挂在 document 上，替换多少次都还有效。 */-->
<script>
    (function () {

        // ---------- 工具 ----------
        function val(name) {
            var el = document.querySelector('[name="' + name + '"]');
            return el ? el.value : '';
        }
        function setVal(name, v) {
            var el = document.querySelector('[name="' + name + '"]');
            if (el) el.value = v;
        }
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // ---------- 头像随邮箱变 ----------
        // 原来是绑在 input 的 oninput 属性上，且用 jQuery 写隐藏域。
        // 非 QQ 邮箱落到默认头像，与改版前一致。
        function syncAvatar() {
            var email = document.getElementById('emailInput').value.trim();
            var avatar = document.getElementById('avatar');
            var qq = /^[1-9]\d{4,10}@qq\.com$/;
            var url = qq.test(email)
                ? 'http://q1.qlogo.cn/g?b=qq&nk=' + email.split('@')[0] + '&s=100'
                : '/images/me.jpg';
            avatar.src = url;
            setVal('avatar', url);
        }
        var emailInput = document.getElementById('emailInput');
        if (emailInput) emailInput.addEventListener('input', syncAvatar);

        // ---------- 表情条开合 ----------
        // 默认收起：90 个表情常年占着两行半。无 JS 时保持展开，不挡功能。
        var emojiBar = document.getElementById('emojiBar');
        var emojiToggle = document.getElementById('emojiToggle');
        if (emojiBar && emojiToggle) {
            emojiBar.setAttribute('hidden', '');
            emojiToggle.addEventListener('click', function () {
                var open = emojiBar.hasAttribute('hidden');
                if (open) { emojiBar.removeAttribute('hidden'); } else { emojiBar.setAttribute('hidden', ''); }
                emojiToggle.setAttribute('aria-expanded', String(open));
            });
        }

        // ---------- 表情 ----------
        document.addEventListener('click', function (e) {
            var btn = e.target.closest('[data-emoji]');
            if (!btn) return;
            var ta = document.getElementById('message-content');
            ta.value += btn.getAttribute('data-emoji');
            ta.focus();
        });

        // ---------- 回复 ----------
        // 原来用 $(window).scrollTo(0, 500)（jQuery 插件），换成原生 scrollTo。
        document.addEventListener('click', function (e) {
            var a = e.target.closest('[data-reply]');
            if (!a) return;
            e.preventDefault();
            var nickname = a.getAttribute('data-messagenickname');
            var ta = document.getElementById('message-content');
            ta.placeholder = '@' + nickname + '：';
            setVal('parentMessageId', a.getAttribute('data-parentmessageid'));
            setVal('rootMessageId', a.getAttribute('data-rootmessageid'));
            window.scrollTo(0, 500);
            ta.focus();
        });

        // ---------- 发送 ----------
        // 把新列表换进来。
        // jQuery 的 .load() 是 .html(html)，会把返回的片段嵌进现有容器里 ——
        // 而返回的片段自己就是一个 #message-container，于是每发一条就多套一层。
        // 这里改成整块替换外层元素，不再积累嵌套。
        function replaceList(html) {
            var old = document.getElementById('message-container');
            if (!old) return;
            old.outerHTML = html;
        }

        function clearContent() {
            var ta = document.getElementById('message-content');
            ta.value = '';
            ta.placeholder = '注意文明发言哦~';
            // 清掉回复目标，否则下一条会莫名变成对上一条的回复
            setVal('parentMessageId', '');
            setVal('rootMessageId', '');
        }

        document.getElementById('messagepost-btn').addEventListener('click', function () {
            var email = val('email');
            var nickname = val('nickname');
            var content = val('content');

            if (!isValidEmail(email)) { alert('请输入有效的邮箱地址'); return; }
            if (!nickname.trim()) { alert('昵称不能为空'); return; }
            if (!content.trim()) { alert('留言内容不能为空'); return; }

            // 发到当前页，带上 pageNum：POST /message 存库后 302 到
            // /messagecomment/{pageNum}，fetch 会自动跟到那个只返回消息列表片段的端点。
            // pageNum 必须是合法整数，否则重定向过去会 400。
            var raw = new URLSearchParams(window.location.search).get('pageNum');
            var pageNum = /^\d+$/.test(raw || '') ? raw : '1';

            var body = new URLSearchParams();
            ['parentMessageId', 'rootMessageId', 'avatar', 'email', 'nickname', 'address', 'content']
                .forEach(function (k) { body.append(k, val(k)); });

            var btn = this;
            btn.disabled = true;

            fetch('/message?pageNum=' + pageNum, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: body.toString()
            })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.text();
                })
                .then(function (html) {
                    replaceList(html);
                    clearContent();
                })
                .catch(function (err) {
                    // 原来的 complete 回调不管成功失败都清表单，失败了内容也没了，
                    // 用户只能重敲一遍。这里失败就保留内容并把原因说出来。
                    alert('发送失败：' + err.message);
                })
                .finally(function () { btn.disabled = false; });
        });
    })();
</script>

</body>
</html>
