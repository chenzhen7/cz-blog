<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="referrer" content="no-referrer"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我-ChenZhen的客栈-CZ的java学习日记</title>
    <meta name="description" content="ChenZhen的个人博客，专注于技术生活分享">
    <meta name="keywords" content="ChenZhen,关于我,陈震，个人博客">

    <link href="../static/images/favicon.ico" th:href="@{/images/me.jpg}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="alternate" type="application/rss+xml" title="ChenZhen的客栈" th:href="@{/rss}">

    <!--/* 动效初始态的门控。必须留在 <head> 里，不能挪到 </body> 前 —— 理由见片段内注释。 */-->
    <th:block th:replace="~{fragments/chrome :: animGate}"/>
</head>
<body>

<th:block th:replace="~{fragments/chrome :: grain}"/>
<th:block th:replace="~{fragments/chrome :: pageWipe('Hello / 关于我')}"/>
<th:block th:replace="~{fragments/chrome :: topbar('about')}"/>

<main>

    <!--/* 页头。model 来自 AboutController：intro（带换行的自我介绍）、content（富文本）、
           skills（字符串数组）、author。 */-->
    <header class="page-head">
        <div class="wrap">
            <div class="eyebrow wipe-in">
                <span class="bar"></span>
                <span class="mono">Hello / 关于我</span>
            </div>
            <!--/* page-title 不挂 wipe-in：它的入场是逐字 3D 飞入（下面脚本拆字，
                   首页 thunder 的小号版），两个揭示系统不叠在同一个元素上。 */-->
            <h1 class="page-title" th:text="${author}">ChenZhen</h1>
            <p class="page-lead rise" th:text="${intro}">我是陈震，欢迎来到我的博客！</p>
        </div>
    </header>

    <!--/* 博客自述。content 是后台维护的富文本，照旧用 th:utext 原样输出 ——
           来源只有管理员自己，与改版前一致。
           这里用 .md-body 承接，不是 .about-body：后者带 white-space: pre-line，
           会把这段 HTML 源码里的换行也渲染出来。 */-->
    <section class="section">
        <div class="wrap">
            <div class="about">
                <div class="about-photo depth-in" data-reveal>
                    <img class="cut-tr" th:src="@{/images/me.jpg}" alt="陈震的照片" width="750" height="750" decoding="async">
                    <span class="plate" th:text="'CZ / ' + ${author}">CZ / ChenZhen</span>
                </div>
                <div class="about-body rise">
                    <div class="eyebrow">
                        <span class="bar"></span>
                        <span class="mono">About this blog / 关于这个博客</span>
                    </div>
                    <div class="md-body" th:utext="${content}">
                        <p>博客自述正文。</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!--/* 技能清单。skills 是 Controller 按 [,，] 切好的数组，
           这里不做任何判断，遍历输出即可。空数组时整块不渲染，避免留一个空标题。 */-->
    <section class="section flush" th:if="${not #lists.isEmpty(skills)}">
        <div class="wrap">
            <div class="sec-head">
                <h2 class="sec-title">我的技能</h2>
            </div>
            <ul class="skills">
                <li th:each="skill : ${skills}" th:text="${skill}">Java</li>
            </ul>
            <!--/* 这段说明改版前是写死在模板里的，逐字保留，不因为改版改写文案 */-->
            <p class="mono-sm" style="color: var(--ink-2); margin-top: 24px; max-width: 70ch;">我的技能涵盖Java主流技术栈包含Web框架、微服务、数据库、缓存、消息队列，一些前端技术，以及Docker、Linux等运维相关技术</p>
        </div>
    </section>

</main>

<th:block th:replace="~{fragments/chrome :: footer}"/>

<th:block th:replace="~{fragments/chrome :: searchDialog}"/>
<th:block th:replace="~{fragments/chrome :: scripts}"/>
<!--/* 前台七页统一引 motion：揭示范围含 .page-head / .post-head / .section / .footer，
     细节见片段头注释。 */-->
<th:block th:replace="~{fragments/chrome :: motion}"/>

<!--/* 人物档案的两个招牌动作：
     1) page-title 逐字 3D 入场 —— 首页 thunder 的小号版：逐字从纵深 rotationX 飞入回正，
        字号沿用 page-title 不放大。只在真要动画时才拆字：拆了不动的收益是零。
     2) .skills li 级联 pop。
     GSAP 没到位就安静跳过：不拆字、不建补间，标题与技能本就完整可见
     （skills 的隐藏初态挂在 .anim 上，motion 会把 .anim 摘掉）。 */-->
<script th:inline="none">
    (function () {
        'use strict';
        if (!window.gsap) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        var title = document.querySelector('.page-head .page-title');
        if (title) {
            var text = title.textContent;
            title.textContent = '';
            // perspective 只在拆了字之后才开：不拆字的页面不需要这层 3D 上下文
            title.classList.add('chars-on');
            var chars = [];
            text.split('').forEach(function (c) {
                var span = document.createElement('span');
                span.className = 'ch';
                span.textContent = c;
                title.appendChild(span);
                chars.push(span);
            });
            // 比首页收一点：纵深 620（首页 820）、角度 -72°（首页 -78°）、时长 1.0（首页 1.25）
            gsap.fromTo(chars,
                { z: -620, rotationX: -72, opacity: 0 },
                { z: 0, rotationX: 0, opacity: 1, duration: 1.0, stagger: 0.06, ease: 'power4.out' });
        }

        if (!window.ScrollTrigger) return;
        gsap.fromTo('.skills li', { opacity: 0, y: 14 }, {
            opacity: 1, y: 0, duration: .45, ease: 'power3.out',
            stagger: 0.04, clearProps: 'transform',
            scrollTrigger: { trigger: '.skills', start: 'top 88%' }
        });
    })();
</script>

</body>
</html>
