<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="referrer" content="no-referrer"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我-ChenZhen的客栈-CZ的java学习日记</title>
    <meta name="description" content="ChenZhen的个人博客，专注于技术生活分享">
    <meta name="keywords" content="ChenZhen,关于我,陈震，个人博客">

    <link th:href="@{/images/me.jpg}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/github-calendar.css}">
    <link rel="alternate" type="application/rss+xml" title="ChenZhen的客栈" th:href="@{/rss}">

    <th:block th:replace="~{fragments/chrome :: animGate}"/>
</head>
<body class="about-station">

<th:block th:replace="~{fragments/chrome :: grain}"/>
<th:block th:replace="~{fragments/chrome :: pageWipe('Hello / 关于我')}"/>
<th:block th:replace="~{fragments/chrome :: topbar('about')}"/>

<main class="about-station-main">
    <div class="wrap">
        <header class="about-station-hero">
            <div>
                <p class="eyebrow"><span class="bar"></span><span class="mono">Hello / 关于我</span></p>
                <h1 th:text="${author}">ChenZhen</h1>
                <p class="about-station-intro" th:text="${intro}">我是陈震，欢迎来到我的博客！</p>
            </div>
            <div class="about-station-portrait">
                <img th:src="@{/images/me.jpg}" alt="ChenZhen 的博客头像" width="750" height="750" decoding="async">
            </div>
        </header>

        <div class="about-station-notes" th:classappend="${#lists.isEmpty(skills)} ? 'single'">
            <article aria-labelledby="about-blog">
                <h2 id="about-blog">关于这个博客</h2>
                <!--/* 保留后台自述的富文本格式。 */-->
                <div class="md-body" th:utext="${content}"><p>博客自述正文。</p></div>
            </article>
            <section th:if="${not #lists.isEmpty(skills)}" aria-labelledby="about-skills">
                <h2 id="about-skills">我的技能</h2>
                <p class="about-station-skill-note">主要关注 Java、Web 框架、微服务、数据库、缓存和消息队列，也涉及前端、Docker 和 Linux。</p>
                <ul class="about-station-skills">
                    <li th:each="skill : ${skills}" th:text="${skill}">Java</li>
                </ul>
            </section>
        </div>

        <section class="about-station-activity" id="github" aria-labelledby="about-github">
            <div class="about-station-activity-head">
                <h2 id="about-github">GitHub 贡献</h2>
                <a class="about-station-profile" href="https://github.com/chenzhen7">@chenzhen7 <span aria-hidden="true">↗</span></a>
            </div>
            <div class="github-calendar-dark" data-calendar
                 data-contributions-url="https://github-contributions-api.jogruber.de/v4/chenzhen7?y=last">
                <p class="about-station-loading" data-calendar-loading role="status" hidden>正在加载 GitHub 贡献…</p>
                <noscript><p>在 GitHub 个人资料页查看贡献日历。</p></noscript>
            </div>
        </section>
    </div>
</main>

<th:block th:replace="~{fragments/chrome :: footer}"/>
<th:block th:replace="~{fragments/chrome :: searchDialog}"/>
<th:block th:replace="~{fragments/chrome :: scripts}"/>
<th:block th:replace="~{fragments/chrome :: motion}"/>
<script th:src="@{/js/github-calendar-snapshot.js}" defer></script>
<script th:src="@{/js/github-calendar.js}" defer></script>

</body>
</html>
