<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>

<!--导航-->

<!--顶部填充空白-->

<!--个人资料描述-->
<div class="container-sm mt-5 " style="max-width: 1000px" align="center">
    <div class="mb-5 " >
        <img class="cz-about-me-img" src="../static/images/me.jpg"  th:src="@{/images/me.jpg}"  >

        <div class="cz-about-me">
            <strong><span class="cz-text-green">HELLO</span> , MY NAME IS👋</strong>
            <div class="mb-2">
                <span class="cz-navbar-brand fs-1 cz-text-shadow-3"><strong th:text="${author}">ChenZhen</strong></span>
            </div>
            <p style="white-space: pre-line;" th:text="${intro}">我是陈震，欢迎来到我的博客！我热爱写作、探索技术和分享知识。</p>
        </div>

    </div>
    <!--简介-->
    <div class="mb-3  ">
        <div class="col">
            <div class="text-center cz-about-me " th:utext="${content}">
            </div>
        </div>
    </div>
    <div class="cz-about-me">
        <span class="cz-navbar-brand fs-1 cz-text-shadow-3 mb-4"><strong>我的技能</strong></span>
        <p class="mb-5"><small>我的技能涵盖Java主流技术栈包含Web框架、微服务、数据库、缓存、消息队列，一些前端技术，以及Docker、Linux等运维相关技术</small></p>
        <div class="row">
            <div class="col-12">
                <div class="row">
                    <div class="col-3 mb-5"
                         th:each="skill  : ${skills}">
                        <span class="mil-upper" th:text="${skill}">Java</span>
                        <div class="mil-progress-track">
                            <div class="mil-progress">
                            </div>
                        </div>
                    </div>


                </div>
            </div>
        </div>
    </div>


</div>

<!--底部栏-->
