<!DOCTYPE html>
<html lang="zh-CN"  xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta name="referrer" content="no-referrer"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类-ChenZhen客栈-CZ的java学习日记</title>
    <meta name="description" content="ChenZhen的个人博客，博客分类页面，对ChenZhen发布的博客进行分类显示">
    <meta name="keywords" content="ChenZhen,博客,博客分类,分类">
    <link href="../static/images/favicon.ico" th:href="@{/images/me.jpg}" rel="icon" type="image/x-ico">
    <link rel="stylesheet" th:href="@{/fonts/fonts.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <script defer th:src="@{/js/tide-lines.js}"></script>
    <link rel="alternate" type="application/rss+xml" title="ChenZhen的客栈" th:href="@{/rss}">

    <!--/* 动效初始态的门控。必须留在 <head> 里，不能挪到 </body> 前 —— 理由见片段内注释。 */-->
    <th:block th:replace="~{fragments/chrome :: animGate}"/>
</head>
<body>

<th:block th:replace="~{fragments/chrome :: grain}"/>
<th:block th:replace="~{fragments/chrome :: pageWipe('Tags / 文章分类')}"/>
<th:block th:replace="~{fragments/chrome :: topbar('tags')}"/>

<main>

    <!--/* model 来自 TagController：tagList（TagVO，含 id / name / blogCount）、
           page（PageInfo<BlogVO>，每页 8 条）、currTagIds（逗号分隔的当前标签 id，可为空串）、author。
           改版前那条 45vh 的背景图带去掉，改用全站统一的 .page-head。 */-->
    <header class="page-head has-tide-lines">
        <div th:replace="~{fragments/chrome :: tideArt(@{/images/tide-lines.svg}, 'tide')}"></div>
        <div class="wrap">
            <div class="eyebrow wipe-in">
                <span class="bar"></span>
                <span class="mono">Tags / 文章分类</span>
            </div>
            <h1 class="page-title wipe-in">标签</h1>
            <p class="page-lead rise">点一个标签，只看它底下的文章；再点一次取消。可以多选。</p>
        </div>
    </header>

    <section class="section">
        <div class="wrap">

            <!--/* 筛选表单。契约与改版前一致，未动：
                   - form 不写 method，默认 GET，提交后 tagIds 出现在地址栏里；
                   - 隐藏域 name="tagIds"，Controller 那边收的是 long[]；
                   - 标签项带 data-tag-id，页面脚本靠它拼隐藏域的值。
                   只换了 class 名（cz-tag-link -> tag-chip），对应的脚本一并在下面重写了。 */-->
            <form id="tagForm" action="/tags" th:if="${not #lists.isEmpty(tagList)}">
                <div class="tag-picker">
                    <a class="tag-chip magnet" href="#" th:each="tag : ${tagList}" th:data-tag-id="${tag.id}">
                        <span class="hash">#</span>
                        <span th:text="${tag.name}">实用教程</span>
                        <span class="count" th:text="${tag.blogCount}">25</span>
                    </a>
                </div>
                <!-- 存放已选标签 id 的隐藏域，值由页面脚本维护 -->
                <input type="hidden" id="selectedTags" name="tagIds" value="">
            </form>

            <div class="sec-head">
                <h2 class="sec-title">文章</h2>
                <!--/* 这里是计数不是链接，所以用 .mono-sm 而不是 .sec-link —— 后者带下划线与悬停变色 */-->
                <span class="mono-sm" style="color: var(--ink-2);">
                    共 <span th:text="${page.total}">0</span> 篇
                </span>
            </div>

            <div class="index">
                <!--/* 行结构与归档页共用 .post-row（日期 / 标题+摘要 / 封面）。
                       这里比归档多一条 .row-meta：原创转载、阅读、评论。
                       日期用 updateTime，与改版前一致（归档页用的是 createTime）。 */-->
                <a class="post-row row-fill rise" th:each="blog : ${page.list}"
                   th:classappend="${#strings.isEmpty(blog.firstPicture)} ? '' : 'has-thumb'"
                   th:href="@{/blog/{id}(id=${blog.id})}">
                    <span class="post-date mono" th:text="${#temporals.format(blog.updateTime,'yyyy-MM-dd')}">2024-07-14</span>
                    <span>
                        <span class="post-title" th:text="${blog.title}">文章标题</span>
                        <span class="post-desc" th:if="${not #strings.isEmpty(blog.description)}"
                              th:text="${blog.description}">文章摘要</span>
                        <span class="row-meta mono-sm">
                            <span class="cat" th:if="${blog.copyright == 1}">原创</span>
                            <span class="cat" th:if="${blog.copyright == 0}">转载</span>
                            <span th:text="${blog.views} + ' 阅读'">0 阅读</span>
                            <span th:text="${blog.commentCount} + ' 评论'">0 评论</span>
                        </span>
                        <span class="row-tags mono-sm" th:if="${not #lists.isEmpty(blog.tagList)}">
                            <span th:each="t : ${blog.tagList}" th:text="${'#' + t.name}">#标签</span>
                        </span>
                    </span>
                    <img class="post-thumb" th:if="${not #strings.isEmpty(blog.firstPicture)}"
                         th:src="${blog.firstPicture}" alt="" width="216" height="122"
                         loading="lazy" decoding="async">
                </a>

                <p class="idx-empty" th:if="${#lists.isEmpty(page.list)}">这个筛选下还没有文章。</p>
            </div>

            <!--/* 分页。翻页必须把 tagIds 带上，否则一翻页筛选就丢了。
                   改版前是用字符串拼 '/tags?pageNum='+n+'&tagIds='+currTagIds，
                   这里换成 @{...(pageNum=${n}, tagIds=${currTagIds})}，
                   由 Thymeleaf 负责编码（currTagIds 是空串时会生成空参数，Controller 收到空数组）。 */-->
            <nav class="pager" th:if="${page.pages > 1}" aria-label="分页">
                <a th:classappend="${page.hasPreviousPage} ? '' : 'is-off'"
                   th:href="@{/tags(pageNum=${page.prePage}, tagIds=${currTagIds})}">上一页</a>
                <a th:each="num : ${page.navigatepageNums}"
                   th:href="@{/tags(pageNum=${num}, tagIds=${currTagIds})}"
                   th:text="${num}" th:attr="aria-current=${page.pageNum == num} ? 'page' : null">1</a>
                <a th:classappend="${page.hasNextPage} ? '' : 'is-off'"
                   th:href="@{/tags(pageNum=${page.nextPage}, tagIds=${currTagIds})}">下一页</a>
            </nav>

        </div>
    </section>

</main>

<th:block th:replace="~{fragments/chrome :: footer}"/>

<th:block th:replace="~{fragments/chrome :: searchDialog}"/>
<th:block th:replace="~{fragments/chrome :: scripts}"/>
<th:block th:replace="~{fragments/chrome :: motion}"/>

<!--/* 标签筛选。点标签 -> 改隐藏域 -> 提交表单整页跳转，与改版前一致。
     只换了 class 名（cz-tag-link -> tag-chip），选择器跟着换。

     原来用 JSON.parse("[" + 参数 + "]") 读地址栏，顺手把它换成了 split。
     原因是 JSON.parse 对空串和尾逗号会抛 SyntaxError，整个脚本当场死掉、标签再也点不动；
     而这个地址栏参数的实际取值受服务端约束 —— tagIds 绑的是 long[]，
     只要有一个空段或非数字段（16, / ,16 / abc）都会在参数绑定阶段就失败，
     根本到不了这一页。所以这里真正会遇到的只有「空串」和「干净的数字串」两种，
     按逗号拆开、丢掉解析不出来的段就够了，不需要额外的防御分支。 */-->
<script>
    (function () {
        var form = document.getElementById('tagForm');
        var hidden = document.getElementById('selectedTags');
        if (!form || !hidden) return;

        var raw = new URLSearchParams(window.location.search).get('tagIds') || '';
        var selected = raw.split(',')
            .map(function (s) { return parseInt(s, 10); })
            .filter(function (n) { return !isNaN(n); });

        // 高亮当前选中的标签
        var chips = document.querySelectorAll('.tag-chip');        chips.forEach(function (chip) {
            var id = parseInt(chip.getAttribute('data-tag-id'), 10);
            if (selected.indexOf(id) !== -1) chip.classList.add('active');
        });

        // 点标签：选中/取消后延迟 280ms 再提交 —— 让信号黄的定向擦入先播完。
        // 立即提交的话新页面直接带着「已选中」的终态渲染，这段擦入永远没机会亮相。
        // 连续点多个标签时清掉上一个计时器，只按最后一次的选中集合提交一次。
        var submitTimer = null;
        chips.forEach(function (chip) {
            chip.addEventListener('click', function (event) {
                event.preventDefault();
                var id = parseInt(this.getAttribute('data-tag-id'), 10);
                var at = selected.indexOf(id);
                if (at === -1) { selected.push(id); } else { selected.splice(at, 1); }
                // 显式 join 成逗号串，不依赖数组到字符串的隐式转换
                hidden.value = selected.join(',');
                this.classList.toggle('active', at === -1);
                clearTimeout(submitTimer);
                submitTimer = setTimeout(function () { form.submit(); }, 280);
            });
        });
    })();
</script>

<!--/* 标签云入场：chips 按序 pop。与筛选脚本分开，因为它是纯增强。
     clearProps 播完交出 transform 所有权 —— 之后悬停位移归 chrome 的
     指针物理循环（.magnet）管，两个系统不抢同一个属性（规范 §5.2）。
     GSAP 没到位就安静跳过：.anim 已被 motion 摘掉，chips 本来就全显示。 */-->
<script th:inline="none">
    (function () {
        'use strict';
        if (!window.gsap || !window.ScrollTrigger) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        gsap.fromTo('.tag-chip', { opacity: 0, y: 14 }, {
            opacity: 1, y: 0, duration: .5, ease: 'power3.out',
            stagger: 0.035, clearProps: 'transform',
            scrollTrigger: { trigger: '.tag-picker', start: 'top 88%' }
        });
    })();
</script>

</body>
</html>
