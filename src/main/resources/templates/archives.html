<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta name="referrer" content="no-referrer"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流年记-CZ的java学习日记</title>
  <meta name="description" content="ChenZhen的个人博客，流年记页面，用于记录生活点滴过往">
  <meta name="keywords" content="ChenZhen的流年记,博客">
  <link href="../static/images/favicon.ico" th:href="@{/images/me.jpg}" rel="icon" type="image/x-ico">
  <link rel="stylesheet" href="../static/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" href="../static/css/me.css" th:href="@{/css/me.css}">
</head>
<body>

  <!--导航-->
<th:block th:replace="~{fragments/legacy :: navbar('archives')}"/>

<!-- 搜索框 -->
<th:block th:replace="~{fragments/legacy :: searchModal}"/>


<!--顶部背景图片-->
<div  alt="" class="cz-bg-section cz-bg-img"
     style="height: 45vh;background-image:url('../static/images/archives.jpg')"
     th:style="'height: 45vh;background-image: url(' + @{/images/archives.jpg} + ')'">

  <div class="m-bg-class_cover" align="center">
    <p class="cz-page-title">- 💾归档 -</p>
    <p class="cz-page-title2 fw-normal">Welcome to my website ——by 陈震 （Chen Zhen）</p>
  </div>

</div>

<!--时间轴-->
<div class="container mt-5" style="max-width: 1170px;">

  <div class="cz-timeline d-none d-md-block">
      <a class="cz-timeline-item " href="#" th:href="@{/blog/{id}(id=${memory.id})}" th:each="memory : ${memoryList}">
        <div class="cz-timeline-content d-flex justify-content-between ">
          <div>
            <div class="cz-timeline-date" th:text="${#temporals.format(memory.createTime)}">2023-01-01 17:52</div>
            <div class="cz-timeline-title text-break" th:text="${memory.title}">文章标题 1</div>
            <div class="cz-timeline-description text-break" th:text="${memory.description}">
              这是第一篇文章的内容摘要或描述。可以添加更多细节和内容。
            </div>
          </div>
          <div class="d-flex align-items-center" th:if="${memory.firstPicture != null && !memory.firstPicture.isEmpty()}">
            <img height="100" width="200" src="../static/images/recommendPicture.png" th:src="@{${memory.firstPicture}}">
          </div>
        </div>
      </a>
  </div>

  <!--移动端展示-->
  <div class="cz-timeline d-md-none">
    <a class="cz-timeline-item " href="#" th:href="@{/blog/{id}(id=${memory.id})}" th:each="memory : ${memoryList}">
      <div class="cz-timeline-content ">
        <div class="cz-timeline-date" th:text="${#temporals.format(memory.createTime)}">2023-01-01 17:52</div>
        <div class="d-flex justify-content-between mb-1">
          <div class="cz-timeline-title text-break" th:text="${memory.title}">文章标题 1</div>
          <div class="d-flex align-items-center" th:if="${memory.firstPicture != null && !memory.firstPicture.isEmpty()}">
            <img height="100" width="200" src="../static/images/recommendPicture.png" th:src="@{${memory.firstPicture}}">
          </div>
        </div>
        <div class="cz-timeline-description text-break" th:text="${memory.description}">
            这是第一篇文章的内容摘要或描述。可以添加更多细节和内容。
        </div>

      </div>

    </a>
  </div>


</div>

<!--底部栏-->
<th:block th:replace="~{fragments/legacy :: footer}"/>


<script src="../static/lib/bootstrap.bundle.min.js" th:src="@{/lib/bootstrap.bundle.min.js}"></script>
<script src="../static/lib/jquery-3.2.1/jquery-3.2.1.min.js" th:src="@{/lib/jquery-3.2.1/jquery-3.2.1.min.js}"></script>
<script src="../static/lib/clickEffect.js" th:src="@{/lib/clickEffect.js}"></script>



<th:block th:replace="~{fragments/legacy :: scripts}"/>
<script>

  $('.menu.toggle').click(function () {
    $('.m-item').toggleClass('m-mobile-hide');
  });

</script>
</body>
</html>
